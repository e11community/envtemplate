# Copy to .github/workflows/validate.yml in a TypeScript action repo.
# Verifies the source type-checks, is formatted, builds — and crucially that the
# committed dist/ bundle matches a fresh build, so the action never ships stale
# code. See the "CI: guard the committed dist/" section of the skill.
name: validate
run-name: Validate

# Runs on pull requests only. There is no `push: [main]` trigger: with the
# locked default branch everything reaches main through a PR that already ran
# this workflow, so a post-merge re-run is redundant — and it would otherwise
# fire again on release-please's release-PR merge.
on:
  pull_request:

permissions:
  contents: read

jobs:
  # Validate that every commit in the PR follows Conventional Commits. The release
  # workflow derives the version bump from these messages, so malformed commits would
  # corrupt versioning.
  #
  # Skipped on release-please's own release PRs (head branch `release-please--*`):
  # those are bot-authored with generated commits/title and need no linting.
  commitlint:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # need the full PR commit range to lint it

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint PR commits
        run: npx --no -- commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  check:
    # Skip release-please's release PRs — a generated version bump + changelog,
    # already covered by the source's own PR.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Format check
        run: npm run format-check

      - name: Build bundle
        run: npm run build

      # Also a published npm package (bin: envtemplate) — run the jest suite.
      - name: Test
        run: npm test

      # The runner executes the committed dist/action.js, not src/. If the
      # bundle was not rebuilt after a src/ change, the action runs stale code.
      # Fail the PR when dist/ differs from a fresh build.
      - name: Verify dist/ is in sync with src/
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is out of date — run 'npm run build' and commit the result."
            exit 1
          fi
